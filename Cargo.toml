[package]
name = "absolute-solver"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.30", features = ["mint"] }
rustc-hash = "2.1.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
zbus = { version = "5.11.0", features = ["tokio"] }

[dependencies.gluon]
git = "https://github.com/technobaboo/gluon.git"
branch = "refactor/strongipc"

[dependencies.stardust-xr-fusion]
version = "0.51.0"
git = "https://github.com/StardustXR/core.git"
branch = "refactor/strongipc"

[dependencies.stardust-xr-molecules]
version = "0.51.0"
git = "https://github.com/StardustXR/molecules.git"
branch = "refactor/strongipc"
